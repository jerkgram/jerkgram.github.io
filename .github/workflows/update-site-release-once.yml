name: Update Jerkgram website for 1.1.0 once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jerkgram-v1.1.0-site-publish
  cancel-in-progress: false

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}

      - name: Preflight website repository
        env:
          RELEASE_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_TOKEN" || {
            echo "Repository secret JERKGRAM_RELEASE_TOKEN is missing." >&2
            exit 1
          }

          test "${GITHUB_REPOSITORY}" = "jerkgram/jerkgram.github.io"
          test "$(git branch --show-current)" = "main"
          test -f .github/workflows/update-site-release-once.yml

          for path in CNAME .nojekyll index.html latest.json altstore-source.json mirrors.json; do
            test -e "$path" || {
              echo "Missing expected website path: $path" >&2
              exit 1
            }
          done

          test -z "$(find . -path './.git' -prune -o -name '*.ipa' -print -quit)" || {
            echo "Website repository must not contain an IPA copy." >&2
            exit 1
          }

      - name: Verify published Jerkgram 1.1.0 release
        env:
          GH_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          url = 'https://api.github.com/repos/jerkgram/Jerkgram-iOS/releases/tags/v1.1.0'
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'jerkgram-site-release-sync'
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)

          expected = {
              'tag_name': 'v1.1.0',
              'name': 'Jerkgram 1.1.0',
              'published_at': '2026-10-21T04:42:39Z',
          }
          for key, value in expected.items():
              if release.get(key) != value:
                  raise SystemExit(
                      f'unexpected release {key}: {release.get(key)!r} != {value!r}'
                  )

          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('release is not a published Stable release')

          assets_list = release.get('assets', [])
          if len(assets_list) != 3:
              raise SystemExit(f'expected exactly 3 release assets, found {len(assets_list)}')

          assets = {a['name']: a for a in assets_list}
          required = {
              'Jerkgram-1.1.0.ipa': (
                  93641504,
                  'sha256:9c20a01417784d92973d5ae862e35aec827484369ee1e8c2bc3e6997f74dc61a'
              ),
              'Jerkgram-1.1.0-source.tar.xz': (
                  156561980,
                  'sha256:c586808b1839e31e8805a1c4c3449619c3d0383c8221ac9ca9b9a1b07e475b8a'
              ),
              'public-source-manifest.json': (
                  9360943,
                  'sha256:9d3ba5c71a01dcbe01a0a160a6d460a8f7106429b3be8eb281968b473cb4ddb2'
              ),
          }
          for name, (size, digest) in required.items():
              a = assets.get(name)
              if not a:
                  raise SystemExit(f'missing release asset: {name}')
              if a.get('size') != size or a.get('digest') != digest:
                  raise SystemExit(
                      f'asset verification failed: {name}; '
                      f"size={a.get('size')!r}, digest={a.get('digest')!r}"
                  )

          print('Published Jerkgram 1.1.0 release and all canonical assets verified.')
          PY

      - name: Update Stable release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          release_url = 'https://github.com/jerkgram/Jerkgram-iOS/releases/tag/v1.1.0'
          ipa_url = 'https://github.com/jerkgram/Jerkgram-iOS/releases/download/v1.1.0/Jerkgram-1.1.0.ipa'
          source_url = 'https://github.com/jerkgram/Jerkgram-iOS/tree/v1.1.0'
          sha = '9c20a01417784d92973d5ae862e35aec827484369ee1e8c2bc3e6997f74dc61a'
          published = '2026-10-21T04:42:39Z'

          latest = {
              'schemaVersion': 2,
              'status': 'stable',
              'githubRepo': 'jerkgram/Jerkgram-iOS',
              'assetPattern': r'^Jerkgram-[0-9][A-Za-z0-9._-]*\.ipa$',
              'version': '1.1.0',
              'build': '163',
              'telegramBaseVersion': '13.0',
              'minimumIOS': '15.0',
              'githubReleaseUrl': release_url,
              'fileName': 'Jerkgram-1.1.0.ipa',
              'downloadUrl': ipa_url,
              'size': 93641504,
              'sha256': sha,
              'publicSourceTag': 'v1.1.0',
              'sourceUrl': source_url,
              'releaseDate': published,
              'telegramChannelUrl': 'https://t.me/JerkgramApp',
              'telegramReleaseUrl': None,
              'communityUrl': 'https://t.me/JerkgramCommunity',
              'altStoreSourceUrl': 'https://jerkgram.github.io/altstore-source.json',
              'sideStoreSourceUrl': 'https://jerkgram.github.io/altstore-source.json'
          }

          altstore = json.loads(Path('altstore-source.json').read_text(encoding='utf-8'))
          if not isinstance(altstore.get('apps'), list) or len(altstore['apps']) != 1:
              raise SystemExit('unexpected AltStore source structure')

          altstore['website'] = 'https://jerkgram.app/'
          altstore['sourceURL'] = 'https://jerkgram.app/altstore-source.json'

          app = altstore['apps'][0]
          if app.get('bundleIdentifier') != 'com.jerkgram.ios':
              raise SystemExit(f"unexpected bundle identifier: {app.get('bundleIdentifier')!r}")

          # Keep the existing, known-good icon URL. The v1.1.0 public source does not
          # contain the old assets/icons path, so do not manufacture a broken v1.1.0 URL.
          existing_icon = app.get('iconURL')
          if not existing_icon:
              raise SystemExit('AltStore iconURL is unexpectedly empty')

          existing_versions = app.get('versions')
          if not isinstance(existing_versions, list):
              raise SystemExit('AltStore versions is not a list')

          new_version = {
              'version': '13.0',
              'buildVersion': '163',
              'marketingVersion': '1.1.0',
              'date': published,
              'localizedDescription': 'Jerkgram 1.1.0 Stable. Based on Telegram for iOS 13.0.',
              'downloadURL': ipa_url,
              'size': 93641504,
              'sha256': sha,
              'minOSVersion': '15.0'
          }

          # Idempotent if the workflow is retried before it self-deletes.
          preserved_versions = [
              v for v in existing_versions
              if v.get('marketingVersion') != '1.1.0'
          ]
          app['versions'] = [new_version] + preserved_versions
          app['iconURL'] = existing_icon

          mirrors = {
              'schemaVersion': 1,
              'status': 'stable',
              'canonical': {
                  'name': 'GitHub Releases',
                  'type': 'canonical',
                  'repository': 'jerkgram/Jerkgram-iOS',
                  'releaseUrl': release_url,
                  'downloadUrl': ipa_url,
                  'sha256': sha
              },
              'mirrors': []
          }

          def write_json(path, obj):
              Path(path).write_text(
                  json.dumps(obj, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )

          write_json('latest.json', latest)
          write_json('altstore-source.json', altstore)
          write_json('mirrors.json', mirrors)
          PY

      - name: Validate website metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_sha = '9c20a01417784d92973d5ae862e35aec827484369ee1e8c2bc3e6997f74dc61a'
          expected_release = 'https://github.com/jerkgram/Jerkgram-iOS/releases/tag/v1.1.0'
          expected_download = 'https://github.com/jerkgram/Jerkgram-iOS/releases/download/v1.1.0/Jerkgram-1.1.0.ipa'
          expected_date = '2026-10-21T04:42:39Z'

          latest = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          alt = json.loads(Path('altstore-source.json').read_text(encoding='utf-8'))
          mirrors = json.loads(Path('mirrors.json').read_text(encoding='utf-8'))

          assert latest['schemaVersion'] == 2
          assert latest['status'] == 'stable'
          assert latest['version'] == '1.1.0'
          assert latest['build'] == '163'
          assert latest['telegramBaseVersion'] == '13.0'
          assert latest['minimumIOS'] == '15.0'
          assert latest['githubReleaseUrl'] == expected_release
          assert latest['fileName'] == 'Jerkgram-1.1.0.ipa'
          assert latest['downloadUrl'] == expected_download
          assert latest['size'] == 93641504
          assert latest['sha256'] == expected_sha
          assert latest['publicSourceTag'] == 'v1.1.0'
          assert latest['sourceUrl'] == 'https://github.com/jerkgram/Jerkgram-iOS/tree/v1.1.0'
          assert latest['releaseDate'] == expected_date

          app = alt['apps'][0]
          assert app['bundleIdentifier'] == 'com.jerkgram.ios'
          assert app.get('iconURL')
          assert isinstance(app.get('appPermissions'), dict)
          assert app['versions']

          v = app['versions'][0]
          assert v['version'] == '13.0'
          assert v['buildVersion'] == '163'
          assert v['marketingVersion'] == '1.1.0'
          assert v['date'] == expected_date
          assert v['downloadURL'] == expected_download
          assert v['size'] == 93641504
          assert v['sha256'] == expected_sha
          assert v['minOSVersion'] == '15.0'

          # Keep 1.0.2 available to clients that need the previous Stable entry.
          assert any(
              old.get('marketingVersion') == '1.0.2'
              and old.get('buildVersion') == '138'
              for old in app['versions'][1:]
          )

          assert mirrors['schemaVersion'] == 1
          assert mirrors['status'] == 'stable'
          assert mirrors['canonical']['releaseUrl'] == expected_release
          assert mirrors['canonical']['downloadUrl'] == expected_download
          assert mirrors['canonical']['sha256'] == expected_sha
          assert mirrors['mirrors'] == []

          # The canonical current-release fields must no longer advertise 1.0.2.
          latest_text = Path('latest.json').read_text(encoding='utf-8')
          mirrors_text = Path('mirrors.json').read_text(encoding='utf-8')
          for path, text in (('latest.json', latest_text), ('mirrors.json', mirrors_text)):
              if 'v1.0.2' in text or 'Jerkgram-1.0.2.ipa' in text:
                  raise SystemExit(f'stale current-release metadata remains in {path}')

          test_values = [
              latest['sha256'],
              v['sha256'],
              mirrors['canonical']['sha256']
          ]
          assert len(set(test_values)) == 1

          print('Website Stable metadata validated for Jerkgram 1.1.0.')
          PY

      - name: Confirm only expected files changed
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' altstore-source.json latest.json mirrors.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            git status --short
            exit 1
          fi
          git diff --check

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-site-release-once.yml
          test ! -e .github/workflows/update-site-release-once.yml

      - name: Commit and push website release metadata
        env:
          PUSH_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Jerkgram Release'
          git config user.email 'actions@users.noreply.github.com'

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'No website release changes detected; refusing to continue.' >&2
            exit 1
          fi

          git commit -m 'Publish Jerkgram 1.1.0 website metadata'
          final_commit="$(git rev-parse HEAD)"

          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$final_commit"

          echo "Jerkgram 1.1.0 website metadata -> ${final_commit}"
