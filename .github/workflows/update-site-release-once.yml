name: Update Jerkgram website release once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}

      - name: Verify published Jerkgram 1.0.2 release
        env:
          GH_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, sys

          url = 'https://api.github.com/repos/jerkgram/Jerkgram-iOS/releases/tags/v1.0.2'
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'jerkgram-site-release-sync'
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)

          expected = {
              'tag_name': 'v1.0.2',
              'name': 'Jerkgram 1.0.2',
              'published_at': '2026-09-10T08:57:18Z',
          }
          for key, value in expected.items():
              if release.get(key) != value:
                  raise SystemExit(f'unexpected release {key}')
          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('release is not a published Stable release')

          assets = {a['name']: a for a in release.get('assets', [])}
          required = {
              'Jerkgram-1.0.2.ipa': (87462123, 'sha256:b0dfe74816fc6b11562390733852390235768d6c1f5ae6fc9710314fd65030c0'),
              'Jerkgram-1.0.2-source.tar.xz': (183766204, 'sha256:5f0eb1e6dbfcd7d955eba10e6aa6caddfa755f2960e86aedb824a84e1b060731'),
              'public-source-manifest.json': (8756660, 'sha256:b50c660c2d2069d8d51393e7f86696a23fd2ec1daddc21c5141127de4fdccbfb'),
          }
          for name, (size, digest) in required.items():
              a = assets.get(name)
              if not a:
                  raise SystemExit(f'missing release asset: {name}')
              if a.get('size') != size or a.get('digest') != digest:
                  raise SystemExit(f'asset verification failed: {name}')
          print('Published release and all canonical assets verified.')
          PY

      - name: Update Stable release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          release_url = 'https://github.com/jerkgram/Jerkgram-iOS/releases/tag/v1.0.2'
          ipa_url = 'https://github.com/jerkgram/Jerkgram-iOS/releases/download/v1.0.2/Jerkgram-1.0.2.ipa'
          source_url = 'https://github.com/jerkgram/Jerkgram-iOS/tree/v1.0.2'
          sha = 'b0dfe74816fc6b11562390733852390235768d6c1f5ae6fc9710314fd65030c0'
          published = '2026-09-10T08:57:18Z'

          latest = {
              'schemaVersion': 2,
              'status': 'stable',
              'githubRepo': 'jerkgram/Jerkgram-iOS',
              'assetPattern': '^Jerkgram-[0-9][A-Za-z0-9._-]*\\.ipa$',
              'version': '1.0.2',
              'build': '138',
              'telegramBaseVersion': '12.9.2',
              'minimumIOS': '13.0',
              'githubReleaseUrl': release_url,
              'fileName': 'Jerkgram-1.0.2.ipa',
              'downloadUrl': ipa_url,
              'size': 87462123,
              'sha256': sha,
              'publicSourceTag': 'v1.0.2',
              'sourceUrl': source_url,
              'releaseDate': published,
              'telegramChannelUrl': 'https://t.me/JerkgramApp',
              'telegramReleaseUrl': None,
              'communityUrl': 'https://t.me/JerkgramCommunity',
              'altStoreSourceUrl': 'https://jerkgram.github.io/altstore-source.json',
              'sideStoreSourceUrl': 'https://jerkgram.github.io/altstore-source.json'
          }

          altstore = json.loads(Path('altstore-source.json').read_text(encoding='utf-8'))
          if not isinstance(altstore.get('apps'), list) or len(altstore['apps']) != 1:
              raise SystemExit('unexpected altstore source structure')
          app = altstore['apps'][0]
          app['bundleIdentifier'] = 'com.jerkgram.ios'
          app['iconURL'] = 'https://raw.githubusercontent.com/jerkgram/Jerkgram-iOS/v1.0.2/Telegram/Telegram-iOS/JerkgramGlassUIPreviews/JerkgramGlassRevealPreview.png'
          # 1.0.0 used the previous Bundle ID, so it is intentionally not kept as an
          # update version under the new com.jerkgram.ios app identity.
          app['versions'] = [{
              'version': '12.9.2',
              'buildVersion': '138',
              'marketingVersion': '1.0.2',
              'date': published,
              'localizedDescription': 'Jerkgram 1.0.2 Stable. Based on Telegram for iOS 12.9.2. Includes expanded blocked-user filtering, performance and stability improvements, Settings updates, localization fixes and Telemetry 2.1.',
              'downloadURL': ipa_url,
              'size': 87462123,
              'sha256': sha,
              'minOSVersion': '13.0'
          }]

          mirrors = {
              'schemaVersion': 1,
              'status': 'stable',
              'canonical': {
                  'name': 'GitHub Releases',
                  'type': 'canonical',
                  'repository': 'jerkgram/Jerkgram-iOS',
                  'releaseUrl': release_url,
                  'downloadUrl': ipa_url,
                  'sha256': sha
              },
              'mirrors': []
          }

          def write_json(path, obj):
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          write_json('latest.json', latest)
          write_json('altstore-source.json', altstore)
          write_json('mirrors.json', mirrors)
          PY

      - name: Validate website metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path('latest.json').read_text())
          alt = json.loads(Path('altstore-source.json').read_text())
          mirrors = json.loads(Path('mirrors.json').read_text())

          assert latest['status'] == 'stable'
          assert latest['version'] == '1.0.2'
          assert latest['build'] == '138'
          assert latest['fileName'] == 'Jerkgram-1.0.2.ipa'
          assert latest['size'] == 87462123
          assert latest['sha256'] == 'b0dfe74816fc6b11562390733852390235768d6c1f5ae6fc9710314fd65030c0'
          assert latest['publicSourceTag'] == 'v1.0.2'
          assert latest['releaseDate'] == '2026-09-10T08:57:18Z'

          app = alt['apps'][0]
          assert app['bundleIdentifier'] == 'com.jerkgram.ios'
          assert len(app['versions']) == 1
          v = app['versions'][0]
          assert v['version'] == '12.9.2'
          assert v['buildVersion'] == '138'
          assert v['marketingVersion'] == '1.0.2'
          assert v['size'] == 87462123
          assert v['sha256'] == latest['sha256']
          assert v['downloadURL'] == latest['downloadUrl']

          assert mirrors['status'] == 'stable'
          assert mirrors['canonical']['releaseUrl'] == latest['githubReleaseUrl']
          assert mirrors['canonical']['downloadUrl'] == latest['downloadUrl']
          assert mirrors['canonical']['sha256'] == latest['sha256']

          for path in ('latest.json', 'altstore-source.json', 'mirrors.json'):
              text = Path(path).read_text(encoding='utf-8')
              if 'ph.telegra.Telegraph' in text or 'Jerkgram-1.0.0.ipa' in text or '/v1.0.0' in text:
                  raise SystemExit(f'stale release metadata remains in {path}')
          print('Website Stable metadata validated.')
          PY

      - name: Confirm only expected files changed
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' altstore-source.json latest.json mirrors.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            git status --short
            exit 1
          fi
          git diff --check

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-site-release-once.yml

      - name: Commit and push website release metadata
        env:
          PUSH_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Jerkgram Release'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Jerkgram 1.0.2 website metadata'
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
